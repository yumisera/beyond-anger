name: Sync Substack posts
on:
  schedule:
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get latest published posts
        run: node scripts/sync-substack.mjs
      - name: Commit updated feed
        run: |
          if ! git diff --quiet -- data/substack.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/substack.json
            git commit -m 'Update Substack conversations'
            git push
          fi
